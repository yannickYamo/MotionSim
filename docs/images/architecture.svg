<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1048 463" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">How MotionSim is put together</title>
  <desc id="d">A datasheet, a device file, typed figures or measurements go through a reader and deterministic checks into a device model. The engine takes that model with the motor, the supply, the cooling and the load, solves losses and junction temperatures together, and gives the results. What fails a check is set aside and shown.</desc>
  <rect width="1048" height="463" fill="#141310"/>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#b9b2a3"/></marker>
  </defs>
  <text x="28" y="30" fill="#8d8779" font-size="12.5">Reading a datasheet runs on your machine, with your own key. Everything from the device model on also runs in the browser.</text>
  <rect data-box="1" x="28" y="52" width="224" height="134" rx="4" fill="none" stroke="#5d584d" stroke-width="1"/>
  <text x="46" y="83" fill="#ece6d8" font-size="15" font-weight="600">What you bring</text>
  <text x="46" y="109" fill="#b9b2a3" font-size="13">A datasheet PDF, a device</text>
  <text x="46" y="128" fill="#b9b2a3" font-size="13">file, nine typed figures,</text>
  <text x="46" y="147" fill="#b9b2a3" font-size="13">or your own double-pulse</text>
  <text x="46" y="166" fill="#b9b2a3" font-size="13">measurements</text>
  <rect data-box="1" x="284" y="52" width="224" height="134" rx="4" fill="none" stroke="#5d584d" stroke-width="1"/>
  <text x="302" y="83" fill="#ece6d8" font-size="15" font-weight="600">Reader</text>
  <text x="302" y="109" fill="#b9b2a3" font-size="13">A language model copies</text>
  <text x="302" y="128" fill="#b9b2a3" font-size="13">the tables as printed and</text>
  <text x="302" y="147" fill="#b9b2a3" font-size="13">names each plot's axes.</text>
  <text x="302" y="166" fill="#b9b2a3" font-size="13">It makes no model values.</text>
  <rect data-box="1" x="540" y="52" width="224" height="134" rx="4" fill="none" stroke="#5d584d" stroke-width="1"/>
  <text x="558" y="83" fill="#ece6d8" font-size="15" font-weight="600">Checks</text>
  <text x="558" y="109" fill="#b9b2a3" font-size="13">Code finds each value on</text>
  <text x="558" y="128" fill="#b9b2a3" font-size="13">its page, reads the curves</text>
  <text x="558" y="147" fill="#b9b2a3" font-size="13">and holds them against</text>
  <text x="558" y="166" fill="#b9b2a3" font-size="13">the tables</text>
  <rect data-box="1" x="796" y="52" width="224" height="134" rx="4" fill="none" stroke="#5d584d" stroke-width="1"/>
  <text x="814" y="83" fill="#ece6d8" font-size="15" font-weight="600">Device model</text>
  <text x="814" y="109" fill="#b9b2a3" font-size="13">Loss and thermal tables,</text>
  <text x="814" y="128" fill="#b9b2a3" font-size="13">each value with the page</text>
  <text x="814" y="147" fill="#b9b2a3" font-size="13">it came from and its test</text>
  <text x="814" y="166" fill="#b9b2a3" font-size="13">conditions</text>
  <rect data-box="1" x="28" y="282" width="224" height="153" rx="4" fill="none" stroke="#5d584d" stroke-width="1"/>
  <text x="46" y="313" fill="#ece6d8" font-size="15" font-weight="600">Your design</text>
  <text x="46" y="339" fill="#b9b2a3" font-size="13">A motor, of seven kinds</text>
  <text x="46" y="358" fill="#b9b2a3" font-size="13">A supply and a design point</text>
  <text x="46" y="377" fill="#b9b2a3" font-size="13">How the stage is cooled</text>
  <text x="46" y="396" fill="#b9b2a3" font-size="13">A load and its motion, or</text>
  <text x="46" y="415" fill="#b9b2a3" font-size="13">a mission profile</text>
  <rect data-box="1" x="284" y="282" width="480" height="153" rx="4" fill="#1c1a16" stroke="#ff4d00" stroke-width="1.6"/>
  <text x="302" y="313" fill="#ece6d8" font-size="15" font-weight="600">Engine</text>
  <text x="302" y="339" fill="#b9b2a3" font-size="13">Motor equations give each switch its current and duty cycle</text>
  <text x="302" y="358" fill="#b9b2a3" font-size="13">Conduction and switching loss, solved with junction temperature</text>
  <text x="302" y="377" fill="#b9b2a3" font-size="13">Followed through time across the whole motion</text>
  <text x="302" y="396" fill="#b9b2a3" font-size="13">Every result says what the data supports and what is assumed</text>
  <text x="302" y="415" fill="#b9b2a3" font-size="13">One engine for the page, the browser and the command line</text>
  <rect data-box="1" x="796" y="282" width="224" height="153" rx="4" fill="none" stroke="#5d584d" stroke-width="1"/>
  <text x="814" y="313" fill="#ece6d8" font-size="15" font-weight="600">Results</text>
  <text x="814" y="339" fill="#b9b2a3" font-size="13">A verdict, with its checks</text>
  <text x="814" y="358" fill="#b9b2a3" font-size="13">Losses and temperatures</text>
  <text x="814" y="377" fill="#b9b2a3" font-size="13">What to build around it</text>
  <text x="814" y="396" fill="#b9b2a3" font-size="13">What the part can drive</text>
  <text x="814" y="415" fill="#b9b2a3" font-size="13">Up to five side by side</text>
  <g stroke="#b9b2a3" stroke-width="1.4" fill="none" stroke-linejoin="round" marker-end="url(#a)"><path d="M252 119H282"/><path d="M508 119H538"/><path d="M764 119H794"/><path d="M908 186V242H700V280"/><path d="M252 358H282"/><path d="M764 358H794"/></g>
  <path d="M652 186V216" stroke="#5d584d" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
  <circle cx="652" cy="219" r="2.5" fill="#5d584d"/>
  <text x="640" y="223" text-anchor="end" fill="#8d8779" font-size="12.5">What fails a check is set aside, and shown</text>
</svg>
