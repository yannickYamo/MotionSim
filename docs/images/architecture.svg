<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="t d" font-family="'Funnel Sans', 'Helvetica Neue', Arial, sans-serif">
  <title id="t">How MotionSim is put together</title>
  <desc id="d">A datasheet, a device file or measurements go through a reader and deterministic checks into a device model. The engine takes that model with the motor, the supply and the load, solves losses and junction temperatures together, and gives four kinds of result.</desc>
  <rect width="960" height="430" fill="#141310"/>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4L0 8z" fill="#b9b2a3"/></marker>
  </defs>
  <g fill="none" stroke="#5d584d" stroke-width="1">
    <rect x="24" y="40" width="168" height="112" rx="3"/>
    <rect x="232" y="40" width="168" height="112" rx="3"/>
    <rect x="440" y="40" width="168" height="112" rx="3"/>
    <rect x="648" y="40" width="168" height="112" rx="3"/>
    <rect x="24" y="252" width="168" height="130" rx="3"/>
    <rect x="648" y="252" width="288" height="130" rx="3"/>
  </g>
  <rect x="336" y="232" width="208" height="170" rx="3" fill="#1c1a16" stroke="#ff4d00" stroke-width="1.6"/>
  <g stroke="#b9b2a3" stroke-width="1.4" fill="none" marker-end="url(#a)">
    <path d="M192 96H230"/><path d="M400 96H438"/><path d="M608 96H646"/>
    <path d="M732 152V200H520V230"/>
    <path d="M192 317H334"/>
    <path d="M544 317H646"/>
  </g>
  <path d="M524 152V196" stroke="#5d584d" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
  <g fill="#ece6d8" font-size="15" font-weight="600">
    <text x="38" y="66">What you bring</text>
    <text x="246" y="66">Reader</text>
    <text x="454" y="66">Checks</text>
    <text x="662" y="66">Device model</text>
    <text x="38" y="278">Your design</text>
    <text x="350" y="260">Engine</text>
    <text x="662" y="278">Results</text>
  </g>
  <g fill="#b9b2a3" font-size="12.5">
    <text x="38" y="90">A datasheet PDF,</text><text x="38" y="107">a device file, or your</text><text x="38" y="124">own double-pulse</text><text x="38" y="141">measurements</text>
    <text x="246" y="90">A language model</text><text x="246" y="107">copies the tables as</text><text x="246" y="124">printed and names</text><text x="246" y="141">each plot's axes</text>
    <text x="454" y="90">Code finds each value</text><text x="454" y="107">on its page, reads the</text><text x="454" y="124">curves, and holds them</text><text x="454" y="141">against the tables</text>
    <text x="662" y="90">Loss and thermal</text><text x="662" y="107">tables, each value</text><text x="662" y="124">with the page it</text><text x="662" y="141">came from</text>
    <text x="38" y="302">A motor, of seven kinds</text><text x="38" y="319">The supply and the</text><text x="38" y="336">design point</text><text x="38" y="353">A load and its motion,</text><text x="38" y="370">or a mission profile</text>
    <text x="350" y="284">Motor equations give</text><text x="350" y="301">current and duty cycle</text>
    <text x="350" y="326">Conduction and switching</text><text x="350" y="343">loss, solved together with</text><text x="350" y="360">junction temperature</text>
    <text x="350" y="385">Followed through the motion</text>
    <text x="662" y="302">Verdict, with checks in plain words</text>
    <text x="662" y="322">What to build: heatsink, capacitor,</text><text x="662" y="339">gate drive, protection</text>
    <text x="662" y="359">What the device can drive</text>
    <text x="662" y="376">Up to five compared side by side</text>
  </g>
  <text x="532" y="180" fill="#8d8779" font-size="12">what fails a check is set aside, and shown</text>
  <text x="24" y="22" fill="#8d8779" font-size="12">Datasheet reading runs on your machine with your own key. Everything from the device model on also runs in the browser.</text>
</svg>
