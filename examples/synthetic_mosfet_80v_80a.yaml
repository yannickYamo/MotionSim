# Synthetic device for trying the tool. Not a real part: the figures are made up to be
# plausible for an 80 V, 80 A silicon MOSFET in a 5 x 6 mm surface-mount package, as used in
# the speed controllers of drones on 12-cell batteries.
schema_version: 1
vendor: made-up
part_number: 80 V MOSFET
technology: Si MOSFET
ratings:
  v_max: 80.0
  i_nominal: 80.0
  tj_max: 175.0
package:
  topology: discrete
  construction: leadframe
  interface: pad
  integrated_driver: false
switch:
  kind: mosfet
  conduction:
    curves:
    - {tj: 25.0, current: [0.0, 80.0], value: [0.0, 0.24]}
    - {tj: 125.0, current: [0.0, 80.0], value: [0.0, 0.384]}
    basis: curve
    source: {kind: synthetic, note: 'made up: on-resistance 3.0 mΩ at 25 °C, 4.8 mΩ at 125 °C, 10 V on the gate', status: unverified}
  reverse:
    curves:
    - {tj: 25.0, current: [0.0, 80.0], value: [0.85, 0.85]}
    basis: point
    assumption: reverse voltage taken as constant at its one tabulated point; it rises with current, so dead-time loss is underestimated
    source: {kind: synthetic, note: 'made up: 0.85 V at 80 A, gate off', status: unverified}
  charge:
    q_gs: 1.0e-08
    q_gd: 6.0e-09
    q_g_th: 6.6e-09
    v_plateau: 4.5
    q_g: 3.5e-08
    q_g_drive: 10.0
    q_oss: 5.0e-08
    v_ref: 40.0
    q_oss_scaling: sqrt
    q_rr: 4.0e-08
    q_rr_current: 30.0
    assumption: gate charge at threshold not tabulated; taken as gate-source charge times threshold voltage over plateau voltage
    source: {kind: synthetic, note: 'made up: gate and output charges from the tables, total gate charge 35 nC at 10 V', status: unverified}
  thermal:
    r: [0.8]
    source: {kind: synthetic, note: 'made up: junction-to-case resistance only (0.8 K/W); no transient data', status: unverified}
  rg_internal: 1.2
