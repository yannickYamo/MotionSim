# Synthetic device for testing the engine. Not a real part: every curve is a straight line
# chosen to be plausible for a 1200 V, 300 A silicon-carbide half-bridge module, three of which
# make the inverter of an electric car on an 800 V battery.
schema_version: 1
vendor: made-up
part_number: 1200 V SiC module
technology: SiC MOSFET
ratings:
  v_max: 1200
  i_nominal: 300
  tj_max: 175
package:
  topology: half_bridge
  construction: substrate
  rth_case_sink: 0.03
switch:
  kind: mosfet
  conduction:
    source: {kind: synthetic, note: "on-resistance 4.2 mOhm at 25 C, 7.0 mOhm at 150 C, 18 V on the gate"}
    curves:
      - {tj: 25, current: [0, 600], value: [0, 2.52]}
      - {tj: 150, current: [0, 600], value: [0, 4.20]}
  reverse:
    source: {kind: synthetic, note: "body diode: 3.0 V rising to 6.0 V at 600 A, gate off"}
