    source: {kind: synthetic, note: "body diode recovery: 3 uJ/A at 25 C, 5 uJ/A at 150 C"}
    curves:
      - {tj: 25, current: [0, 600], value: [0, 1.8e-3]}
      - {tj: 150, current: [0, 600], value: [0, 3.0e-3]}
  thermal:
    source: {kind: synthetic}
    r: [0.02, 0.05, 0.05]
    tau: [0.001, 0.01, 0.1]
