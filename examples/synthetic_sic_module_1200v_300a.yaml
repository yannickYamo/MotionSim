      - {tj: 25, current: [0, 600], value: [0, 16.2e-3]}
      - {tj: 150, current: [0, 600], value: [0, 17.4e-3]}
  e_off:
    v_ref: 800
    source: {kind: synthetic, note: "12 uJ/A at 25 C, 13 uJ/A at 150 C"}
