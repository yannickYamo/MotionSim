# Synthetic device for trying the tool. Not a real part: the figures are made up to be
# plausible for a 100 V, 40 A GaN transistor in a small surface-mount package, as used where
# a drive switches fast: high-speed motors, drones, compact servo drives.
schema_version: 1
vendor: made-up
part_number: 100 V GaN transistor
technology: GaN HEMT
ratings:
  v_max: 100.0
  i_nominal: 40.0
  tj_max: 150.0
package:
  topology: discrete
  construction: unknown
  interface: pad
  integrated_driver: false
switch:
  kind: mosfet
  conduction:
    curves:
    - {tj: 25.0, current: [0.0, 40.0], value: [0.0, 0.18]}
    - {tj: 125.0, current: [0.0, 40.0], value: [0.0, 0.30]}
    basis: curve
    source: {kind: synthetic, note: 'made up: on-resistance 4.5 mΩ at 25 °C, 7.5 mΩ at 125 °C, 5 V on the gate', status: unverified}
  reverse:
    curves:
    - {tj: 25.0, current: [0.0, 40.0], value: [1.8, 2.4]}
    basis: curve
    source: {kind: synthetic, note: 'made up: conducting in reverse with the gate off, 1.8 V rising to 2.4 V at 40 A; no diode, so nothing to recover', status: unverified}
  charge:
    q_gs: 3.0e-09
    q_gd: 1.6e-09
    q_g_th: 1.6e-09
    v_plateau: 2.6
    q_g: 8.0e-09
    q_g_drive: 5.0
    q_oss: 2.8e-08
    v_ref: 50.0
    q_oss_scaling: sqrt
    q_rr: 0.0
    assumption: gate charge at threshold not tabulated; taken as gate-source charge times threshold voltage over plateau voltage
    source: {kind: synthetic, note: 'made up: gate and output charges from the tables, total gate charge 8 nC at 5 V; no reverse recovery', status: unverified}
  thermal:
    r: [0.6]
    source: {kind: synthetic, note: 'made up: junction-to-case resistance only (0.6 K/W); no transient data', status: unverified}
  rg_internal: 0.4
