# Once a week, one pull request for each of: the Python libraries, the page's build tools,
# and the actions the workflows use. A release is left a week before it is proposed, so one
# that is withdrawn in its first days never arrives here.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      web:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
