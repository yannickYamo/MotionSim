name: ci
on:
  push:
  pull_request:
jobs:
  engine:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ".[dev]" build
      - run: ruff format --check src tests web/scripts
      - run: ruff check src tests web/scripts
      - run: pytest -q --cov=motionsim --cov-report=term-missing:skip-covered
      # The package as a user gets it: built, installed on its own, and asked the README's question.
      - run: python -m build --wheel
      - run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install -q dist/*.whl
          /tmp/clean/bin/motionsim --version
          /tmp/clean/bin/motionsim simulate examples/synthetic_igbt_600v_30a.yaml --vdc 300 --irms 10 --m 0.9 --pf 0.85 --fsw 8000 --tsink 60 | grep "45.25 W"
          /tmp/clean/bin/motionsim design init -o /tmp/design.yaml
          /tmp/clean/bin/motionsim design run /tmp/design.yaml --json > /dev/null
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install .
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web
      # The page shipped in the package has to be the page these sources build: a change to
      # the page or the engine without a rebuild fails here.
      - run: git diff --exit-code -- src/motionsim/webui
      # The engine as the hosted page runs it, inside the browser's Python, gives the figures
      # the installed engine gives.
      - run: npm run engine-check
        working-directory: web
        env:
          PYTHON: python
      # The page as it is hosted, walked in a browser: a first visit, a made-up part, every
      # step to a verdict, a setting changed, a reload, at a desk's width and a phone's.
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run journey
        working-directory: web
