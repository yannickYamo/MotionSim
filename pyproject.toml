[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motionsim"
version = "0.3.2"
description = "From a power transistor's datasheet, whichever vendor's, to the losses and junction temperatures of a motor drive"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Yannick Maurice" }]
requires-python = ">=3.11"
keywords = ["power electronics", "inverter", "motor drive", "IGBT", "MOSFET", "SiC", "GaN", "thermal", "datasheet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "pdfplumber>=0.11",
    "pypdfium2>=4.0",
    "pillow>=10.0",
    "anthropic>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "hypothesis", "ruff==0.17.0", "mypy", "types-PyYAML", "pre-commit"]

[project.scripts]
motionsim = "motionsim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/motionsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# The rules that find mistakes, and the ones that keep imports and idiom even. Complexity
# rules are left for when the long functions have been split, not silenced one by one now.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # a sentence for the user is not broken to fit a column
    "RUF001",  # the degree sign, the micro sign and the multiplication dot are meant
    "RUF002",
    "RUF003",
    "RUF005",  # [*a, b] against a + [b]: neither is a mistake
    "RUF007",  # zip(a, a[1:]) is read at a glance; pairwise is not yet
    "UP042",   # str and Enum together keep the values plain strings in the files written
    "E741",    # l is an inductance and I a current, as they are written everywhere
    "SIM102",  # two conditions that are two thoughts stay two ifs
    "SIM108",  # an if and an else that each say something stay an if and an else
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E731"]  # a one-line helper inside a test reads better as a lambda

[tool.coverage.run]
source = ["motionsim"]
branch = true

[tool.coverage.report]
# Measured at 81% on the public tree (the reader's tests on real datasheets are not shipped).
# Held a little under that, and raised as tests land.
fail_under = 78
