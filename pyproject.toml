[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motionsim"
version = "0.1.0"
description = "From any power-semiconductor datasheet to the losses and junction temperatures of a motor drive, on a local page"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Yannick Maurice" }]
requires-python = ">=3.11"
keywords = ["power electronics", "inverter", "motor drive", "IGBT", "MOSFET", "SiC", "GaN", "thermal", "datasheet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "pdfplumber>=0.11",
    "pypdfium2>=4.0",
    "pillow>=10.0",
    "anthropic>=0.80",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
motionsim = "motionsim.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/motionsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
